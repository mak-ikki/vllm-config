services:

  vllm-server:
    image: vllm-node  # built via spark-vllm-docker/build-and-copy.sh
    container_name: vllm_node
    restart: unless-stopped
    network_mode: host
    ipc: host
    privileged: true
    runtime: nvidia
    cgroup: host  # Ubuntu 24.04: nsdelegate on cgroupv2

    environment:
      - CUDA_VISIBLE_DEVICES=0

    volumes:
      - /home/mak/ai-models:/root/.cache/huggingface
      - /home/mak/.cache/vllm:/root/.cache/vllm
      - /home/mak/.cache/flashinfer:/root/.cache/flashinfer
      - /home/mak/.triton:/root/.triton

    command:
      - vllm
      - serve
      - Qwen/Qwen3.6-35B-A3B
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --max-model-len
      - "131072"
      - --gpu-memory-utilization
      - "0.90"
      - --max-num-batched-tokens
      - "32768"
      - --kv-cache-dtype
      - fp8
      - --load-format
      - auto
      - --attention-backend
      - flashinfer
      - --enable-prefix-caching
      - --enable-chunked-prefill
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --reasoning-parser
      - qwen3
      - --served-model-name
      - qwen3.6
      - --uvicorn-log-level
      - warning

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s


  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - vllm-server
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OPENAI_API_BASE_URLS=http://host.docker.internal:8000/v1
      - OPENAI_API_KEYS=sk-dummy
      - ENABLE_API_KEYS=true
      - USER_PERMISSIONS_FEATURES_API_KEYS=true


volumes:
  open-webui:
