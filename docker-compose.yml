name: ikki-spark

services:
  vllm:
    build:
      context: .
      dockerfile: Dockerfile
    image: ikki-spark-vllm
    container_name: qwen36-vllm
    restart: unless-stopped

    networks:
      - hermes-net

    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - NVIDIA_FORWARD_COMPAT=1
      - VLLM_WORKER_MULTIPROC_METHOD=spawn
      - VLLM_DISABLE_FP4_MOE_PROBE=1
      - VLLM_FLASHINFER_MOE_BACKEND=latency
      - HF_HOME=/root/.cache/huggingface
      - TORCH_CUDA_ARCH_LIST=12.1a
      - TORCH_MATMUL_PRECISION=high
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - TOKENIZERS_PARALLELISM=false

    volumes:
      - /home/mak/ai-models:/root/.cache/huggingface
      - vllm-logs:/var/log/vllm

    ports:
      - "8000:8000"

    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack:
        soft: 67108864
        hard: 67108864

    command: >
      Qwen/Qwen3.6-27B-FP8
      --host 0.0.0.0
      --port 8000
      --max-model-len 131072
      --max-num-batched-tokens 32768
      --gpu-memory-utilization 0.90
      --max-num-seqs 32
      --kv-cache-dtype fp8_e4m3
      --attention-backend flashinfer
      --moe-backend flashinfer_cutlass
      --enable-chunked-prefill
      --enable-prefix-caching
      --language-model-only
      --reasoning-parser qwen3
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --chat-template /workspace/unsloth.jinja
      --speculative-config '{"method": "mtp", "num_speculative_tokens": 7}'
      --max-cudagraph-capture-size 1024
      --trust-remote-code

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

networks:
  hermes-net:
    driver: bridge

volumes:
  vllm-logs:
    driver: local
